openapi: 3.2.0
info:
  title: TikTok Shop Orders API
  description: The TikTok Shop Partner API enables sellers and partners to manage product catalogs, process orders, handle logistics, and integrate with TikTok's commerce ecosystem. Base URL format includes shop_cipher for multi-shop support.
  version: v2
  contact:
    name: TikTok Shop Partner Center
    url: https://partner.tiktokshop.com/docv2/page/tts-api-concepts-overview
  termsOfService: https://developers.tiktok.com/doc/tiktok-api-terms-of-service
servers:
- url: https://open-api.tiktokglobalshop.com
  description: TikTok Shop Global API
security:
- AccessToken: []
tags:
- name: Orders
  description: Order management and fulfillment
paths:
  /order/202309/orders:
    get:
      operationId: listOrders
      summary: List Orders
      description: Retrieves a list of orders for the seller's TikTok Shop with filtering and pagination.
      tags:
      - Orders
      parameters:
      - name: page_size
        in: query
        schema:
          type: integer
          default: 10
          maximum: 100
      - name: page_token
        in: query
        schema:
          type: string
      - name: order_status
        in: query
        schema:
          type: string
          enum:
          - UNPAID
          - ON_HOLD
          - AWAITING_SHIPMENT
          - AWAITING_COLLECTION
          - IN_TRANSIT
          - DELIVERED
          - COMPLETED
          - CANCELLED
        description: Filter by order status
      - name: create_time_ge
        in: query
        schema:
          type: integer
        description: Filter orders created after this Unix timestamp
      - name: create_time_lt
        in: query
        schema:
          type: integer
        description: Filter orders created before this Unix timestamp
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
  /order/202309/orders/{order_id}:
    get:
      operationId: getOrder
      summary: Get Order
      description: Retrieves detailed information about a specific order by its ID.
      tags:
      - Orders
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Order details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
components:
  schemas:
    Order:
      type: object
      properties:
        order_id:
          type: string
        order_status:
          type: string
        create_time:
          type: integer
        paid_time:
          type: integer
        buyer_email:
          type: string
        recipient_address:
          $ref: '#/components/schemas/Address'
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
    LineItem:
      type: object
      properties:
        item_id:
          type: string
        product_name:
          type: string
        sku_id:
          type: string
        quantity:
          type: integer
        sale_price:
          $ref: '#/components/schemas/Price'
    Address:
      type: object
      properties:
        name:
          type: string
        phone_number:
          type: string
        address_line1:
          type: string
        city:
          type: string
        province_code:
          type: string
        postal_code:
          type: string
        region_code:
          type: string
    OrderDetailResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          $ref: '#/components/schemas/Order'
    Price:
      type: object
      properties:
        amount:
          type: string
        currency:
          type: string
    OrderListResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          properties:
            orders:
              type: array
              items:
                $ref: '#/components/schemas/Order'
            next_page_token:
              type: string
            total_count:
              type: integer
  securitySchemes:
    AccessToken:
      type: apiKey
      in: header
      name: x-tts-access-token
      description: TikTok Shop API access token
