aid: tiktok
name: TikTok
description: TikTok is a short-form social video platform offering developers REST
  APIs for advertising, e-commerce, content discovery, and platform integrations.
  Key products include the TikTok API for Business (advertising and campaign management),
  TikTok Shop API (seller product and order management), and the Data Portability
  API.
